<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#fbf9f6"/>
<meta name="description" content="Latch — Meet beyond the profile. Dating built around shared interests, genuine conversation and discovery near or far."/>
<link rel="icon" href="./icon.svg" type="image/svg+xml"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<title>Latch — Meet beyond the profile</title>
<style>
  #root .boot-fallback{font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;background:#fbf9f7;color:#2b2430;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  #root .boot-card{max-width:440px;background:#fff;border:1px solid #eee3e1;border-radius:20px;padding:38px 28px;box-shadow:0 16px 55px #3c213211}
  #root .boot-logo{font-size:36px;font-weight:800;letter-spacing:-2px}
  #root .boot-logo span{color:#ef9186}
  #root .boot-card p{font-size:13px;color:#82747d;line-height:1.7}
  #root .boot-help{display:none;padding-top:17px;border-top:1px solid #eee6e3;margin-top:19px!important}
  #root .boot-help a{font-weight:700;color:#aa6072}
</style>
</head>
<body>
<div id="root">
  <main class="boot-fallback" data-latch-boot>
    <div class="boot-card">
      <div class="boot-logo">latch<span>.</span></div>
      <p>Loading your connections…</p>
      <p class="boot-help" data-latch-error>
        Latch could not start. Check <a href="https://github.com/Astarkmarkus/Latch/settings/pages">GitHub Pages → Source</a> is set to <strong>GitHub Actions</strong>, not “Deploy from a branch”.
      </p>
    </div>
  </main>
</div>
<script>
  window.setTimeout(function () {
    var stillLoading=document.querySelector('[data-latch-boot]');
    if (stillLoading) {
      var error=stillLoading.querySelector('[data-latch-error]');
      if(error)error.style.display='block';
    }
  },5000);
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
